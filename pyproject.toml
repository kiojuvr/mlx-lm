[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "cmake>=3.27",
    # Match the nanobind ABI used by MLX 0.32.2. A mismatched nanobind ABI can
    # reject mlx.core.array arguments at the custom-kernel boundary.
    "nanobind==2.15.0",
    "mlx==0.32.2; platform_system == 'Darwin'",
]
build-backend = "setuptools.build_meta"
